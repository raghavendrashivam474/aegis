[project]
name = "aegis"
version = "0.1.0"
description = "Intelligent autonomous industrial/IoT system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aegis Contributors" }
]
dependencies = [
    "paho-mqtt>=2.0,<3.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
]

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"