[project]
name = "aegis"
version = "0.1.0"
description = "Intelligent autonomous industrial/IoT system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aegis Contributors" }
]
dependencies = [
    "psycopg[binary,pool]>=3.1.0",
    "paho-mqtt>=2.0,<3.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
]

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"
markers = [
    "integration: marks tests requiring live Docker infrastructure (PostgreSQL, MQTT)",
]

[tool.ruff.lint.per-file-ignores]
# Scripts use sys.path manipulation before imports (E402) and contain
# long demonstration output strings (E501). These are standalone demo
# scripts, not production modules.
"scripts/**" = ["E402", "E501", "C901"]

# Dataset replay modules use sys.path setup for standalone execution (E402).
"apps/dataset_replay/registration.py" = ["E402"]
"apps/dataset_replay/replay.py" = ["E402"]
"apps/dashboard/app.py" = ["E402", "E501"]

# Test files contain long assertion lines and setup calls that reduce
# readability when broken across lines (E501).
"tests/**" = ["E501"]

# Intelligence services contain long domain-description strings and
# f-strings that lose clarity when broken. Complexity (C901) reflects
# the inherent decision-tree nature of diagnostic and risk logic.
"packages/intelligence/risk_service.py" = ["E501", "C901"]
"packages/intelligence/diagnostic_service.py" = ["E501"]
"packages/intelligence/anomaly_service.py" = ["E501", "C901"]

# Evaluation harness contains complex benchmark orchestration methods
# that are out of scope for P4.S1 refactoring.
"packages/evaluation/performance_harness.py" = ["C901"]
