name: Aegis CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type & Architecture Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker Infrastructure (PostgreSQL & Mosquitto)
        run: |
          docker compose up -d
          docker compose ps

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e .

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Pytest Suite & Architecture Boundary Verification
        env:
          AEGIS_DATABASE_URL: postgresql://aegis_admin:aegis_password@localhost:5434/aegis_db
          AEGIS_MQTT_HOST: localhost
          AEGIS_MQTT_PORT: 1883
        run: pytest -v
