dataset:
  name: "C-MAPSS Turbofan Engine Degradation Simulation"
  subset: "FD001"
  description: >
    Single operating condition, single fault mode (HPC degradation).
    100 turbofan engines, each run to failure.
    21 sensor measurements + 3 operational settings per cycle.

