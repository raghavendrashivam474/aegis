timestamp_synthesis:
  method: "deterministic offset from cycle number"
  base: "2026-01-01T00:00:00+00:00"
  interval: "1 minute per cycle"
  formula: "base + (cycle - 1) * 60 seconds"
  rationale: >
    C-MAPSS provides only ordinal cycle numbers.
    Synthetic timestamps preserve ordering and enable
    time-range queries without fabricating wall-clock provenance.

known_limitations:
